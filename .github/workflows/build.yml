name: Build and deploy resume site

# Source of truth for content: data/cv.yaml (distilled from the private
# personal-agent-memory repo's professional/career/*.md files).
# This workflow renders it through the Jinja2 templates in templates/ into
# multiple resume designs (dist/<template>/index.html), prints each to a PDF
# with headless Chromium (Playwright), and deploys the whole dist/ folder
# (a template-picker page + each design's HTML/PDF) as this GitHub Pages site.

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install jinja2 pyyaml playwright

      - name: Install headless Chromium
        run: playwright install --with-deps chromium

      - name: Render resume templates (cv.yaml -> dist/<template>/index.html)
        run: python3 scripts/render_templates.py

      - name: Export each template to PDF
        run: python3 scripts/export_pdfs.py

      - name: List dist output
        run: find dist -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
